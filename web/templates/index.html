<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pool Scorekeeper</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='scoreboard.css') }}">
</head>
<body>
  <header>
    <h1>Pool Scorekeeper <span class="game">8-ball</span></h1>
    <a class="nav-link" href="{{ url_for('debug') }}">Debug dashboard</a>
    <div class="status-pill" id="status-pill" data-state="idle">
      <span class="dot"></span>
      <span id="status-label">IDLE</span>
    </div>
  </header>

  <main class="layout">
    <section class="feed" aria-label="Camera feed">
      <img id="feed" alt="Camera view of the table">
      <div class="feed-badge" id="feed-badge" hidden></div>
      <div class="feed-empty" id="feed-empty">No camera feed yet. Start capture with <code>python3 -m src.main</code>.</div>
    </section>

    <section class="score" aria-label="Score">
      <div class="score-note" id="score-note" hidden></div>
      <div class="notice" id="notice" hidden></div>

      <article class="group" id="group-table">
        <h2>On the table
          <span class="cue-chip" id="cue-chip" hidden title="Cue ball is on the table"><span class="ball cue mini"></span>Cue</span>
          <span class="count" id="count-table"></span>
        </h2>
        <div class="balls" id="balls-table"></div>
      </article>

      <article class="group" id="group-solids">
        <h2>Solids <span class="sub">sunk</span> <span class="count" id="count-solids"></span></h2>
        <div class="balls" id="balls-solids"></div>
      </article>

      <article class="group" id="group-stripes">
        <h2>Stripes <span class="sub">sunk</span> <span class="count" id="count-stripes"></span></h2>
        <div class="balls" id="balls-stripes"></div>
      </article>
    </section>
  </main>

  <script src="{{ url_for('static', filename='scoreboard.js') }}"></script>
</body>
</html>
