{# Top nav shared by every page; the current page is highlighted. #}
<nav class="nav-links" aria-label="Pages">
  {% for endpoint, label in [("index", "Scoreboard"), ("drills", "Drills"), ("debug", "Debug")] %}
  <a class="nav-link" href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
